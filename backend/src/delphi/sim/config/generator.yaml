# The synthetic bank's profiles and population (docs/14 §2–3). Numbers marked "docs/14" are
# the spec's; the rest fill a gap the spec leaves open and are listed in docs/14 §3. A change
# here is a new generator_version (response_models.yaml) and a CHANGELOG.md entry.

profiles:   # docs/14 §2
  test: {customers: 200, history_days: 21, maturity_days: 7, window_days: 3, seed: 1}
  demo: {customers: 2000, history_days: 150, maturity_days: 60, window_days: null, seed: 20261031}
  eval: {customers: 20000, history_days: 150, maturity_days: 60, window_days: 30, seed: 7}
# docs/14 §2: eval and test end their history here; demo ends it at the dataset's creation time.
fixed_history_end: "2026-07-01T00:00:00+05:30"

population:
  # docs/14 §3: 18–85; P(≥ 70) = 0.12; P(60–69) = 0.15; the rest uniform over 18–59.
  # Within the two older bands the age is uniform too (gap).
  age_bands:   # [lowest, highest, probability]
    - [18, 59, 0.73]
    - [60, 69, 0.15]
    - [70, 85, 0.12]
  # docs/14 §3: hi 0.40, en 0.25, te 0.12, ta 0.12, other → en 0.11.
  language: {hi: 0.40, en: 0.36, te: 0.12, ta: 0.12}
  disability_probability: 0.02            # docs/14
  income_band: {LOW: 0.45, MID: 0.40, HIGH: 0.15}   # docs/14
  income_amount_scale: {LOW: 0.5, MID: 1.0, HIGH: 3.0}   # docs/14
  consent_call_status_probability: 0.70   # docs/14
  device_count: {1: 0.8, 2: 0.2}          # docs/14
  known_device_min_age_days: 30           # gap: a known device is ≥ 30 days old at the start
  # Owner decision (#56): 10% of genuine non-merchant accounts were opened 30–365 days before
  # the history (uniform), so a young payee account is a mule signal, not a tell (docs/14 §3).
  young_account_share: 0.10
  young_account_days: {min: 30, max: 365}
  # Owner decision (#49): 5% of genuine non-merchant accounts have MINIMAL KYC, so minimal KYC
  # is a strong mule signal but not a tell (docs/14 §3).
  genuine_kyc_minimal_share: 0.05
  payee_count: {min: 3, max: 15}          # docs/14; uniform count (gap)
  # docs/14: 70% of counterparties at DLPH, the rest spread over XBK1–XBK5 (evenly: gap).
  counterparty_home_bank_share: 0.70
  external_banks: [XBK1, XBK2, XBK3, XBK4, XBK5]
  # Gaps:
  segment: RETAIL                         # every generated customer is a retail customer
  device_os: {ANDROID: 0.85, IOS: 0.15}
  payee_type: {FAMILY: 0.40, UTILITY: 0.20, MERCHANT: 0.40}
  account_tenure_years: {min: 1, max: 10}  # uniform, before history start
  external_counterparty_income_band: MID  # external family payees' balances scale like MID
  # Log-normal opening balance, median × the income band's amount scale.
  opening_balance_inr: {median: 40000, sigma: 1.0}
  home_city:
    hi: {Delhi: 0.40, Lucknow: 0.30, Jaipur: 0.30}
    en: {Bengaluru: 0.40, Mumbai: 0.40, Kolkata: 0.20}
    te: {Hyderabad: 1.0}
    ta: {Chennai: 1.0}

merchants:
  # docs/14 §3: 300 (demo) / 3,000 (eval), 20 of them hospitals on demo: 0.15 per customer,
  # 1 in 15 a hospital, on every profile.
  per_customer: 0.15
  hospital_one_in: 15
  # The other categories (gap); docs/14 §4 names wedding vendors and property tokens.
  categories: {GROCERY: 0.25, UTILITY: 0.20, RETAIL: 0.20, FUEL: 0.10, TELECOM: 0.10,
               EDUCATION: 0.07, WEDDING_VENDOR: 0.04, PROPERTY: 0.04}

# The history period's payments (docs/14 §4). Customer payments go through B1 below.
genuine_routine:
  daily_rate_gamma: {shape: 2.0, scale: 0.3}   # docs/14: λ ~ Gamma(2, 0.3) payments per day
  # Gaps: a customer pays its payees with Zipf weights 1 / rank^exponent (docs/14 §3 "Zipf-
  # weighted"), log-normal amounts per payee type × the income band's scale, at a habitual
  # local hour (uniform 8–21 per customer) plus normal noise.
  zipf_exponent: 1.0
  amount_inr:
    FAMILY: {median: 2000, sigma: 0.9}
    UTILITY: {median: 800, sigma: 0.6}
    MERCHANT: {median: 600, sigma: 1.0}
  habitual_hour: {min: 8, max: 21}
  hour_sd: 1.5
  channel:
    FAMILY: {UPI_PUSH: 0.80, IMPS: 0.15, NEFT: 0.05}
    UTILITY: {UPI_PUSH: 0.60, NEFT: 0.40}
    MERCHANT: {UPI_PUSH: 1.0}
  # Gap: a monthly salary credit (NEFT, on the 1st, 10:00–12:00 IST) from a payroll account
  # at one of the external banks keeps balances from draining. Payroll accounts start with a
  # balance large enough for every salary.
  salary_inr: {median: 30000, sigma: 0.4}
  salary_hour: {min: 10, max: 12}
  payroll_opening_balance_inr: 10000000000
  payroll_account_age_days: 3650           # payroll accounts are ten years old
  # Owner decision (#56): genuine customers also add new person (family or friend) payees
  # during the history, so a person payee saved during the history is not a mule tell. Gaps:
  # about once a year per customer; another customer's DLPH account or an external person
  # account (population.counterparty_home_bank_share); saved minutes before the first
  # payment (as a victim's mule payee is); 0–3 more payments over the next 60 days.
  new_person_payee:
    mean_days: 365
    lead_minutes: {min: 2, max: 30}
    follow_up_payments: {min: 0, max: 3}
    follow_up_days: 60

# How a session's §5.1 signals become session_telemetry values (gaps). The values are placed
# on the right side of the KB's classifier thresholds (kb/engine.yaml `classifiers`), so the
# docs/08 §5 classifiers read the intended outcome back.
telemetry:
  paste_share: 0.5                    # of paste/long-dwell sessions, half paste
  screen_share_share: 0.3             # of remote-access sessions, 30% screen share
  normal_dwell_s: {min: 1.0, max: 12.0}
  long_dwell_extra_s: {median: 15, sigma: 0.5}   # added to the dwell threshold
  cadence_excess_z: 1.0               # mean of the exponential excess over the z threshold
  session_duration_s: {median: 45, sigma: 0.5}

legacy_policy:   # docs/22 §2, baseline B1
  hold_new_payee_min_inr: 50000
  hold_new_device_min_inr: 10000
  hold_collect_approval_min_inr: 25000
  # docs/13 §3 is_new_payee: added < 24 h ago, or never paid and added within the 30-day
  # behavioural-baseline window (docs/13 §3 "10 min, 24 h, 30 days, lifetime").
  new_payee_hours: 24
  payee_baseline_days: 30

# docs/14 §4: GENUINE_UNUSUAL is 150 per 10,000 payments against GENUINE_ROUTINE's 9,700, so
# each customer's unusual events run at its routine rate × 150 / 9,700.
genuine_unusual:
  rate_per_10k: 150
  routine_rate_per_10k: 9700
  night_share: 0.30                        # docs/14: 30% happen at night
  merchant_categories: [HOSPITAL, WEDDING_VENDOR, PROPERTY]   # docs/14
  # Gaps: a large one-off is either to a new merchant (saved minutes before paying it) or
  # from a new phone (first seen minutes before) to an established family payee.
  kind: {NEW_MERCHANT: 0.6, NEW_PHONE: 0.4}
  night_hours: {min: 22, max: 29}          # 22:00–05:00 IST (hours past midnight wrap)
  amount_inr: {median: 80000, sigma: 0.7}  # × the income band's scale
  # Gap (#55): at most 90% of the balance at the time (the customer pays what they can), as
  # investment victims do, so the one-off is made in the window too.
  max_balance_share: 0.9
  # Calibration (#55): rates are per 10,000 payments *made*. A routine payment the customer
  # cannot fund is not made (about 13–17% on `eval`), but a one-off always is (it is capped
  # above), so the planned one-off rate is scaled by this share. Measured on `eval`: without
  # it, 172.2 (history) and 179.9 (window) per 10,000; 0.85 brings both within ±3% of 150.
  made_share: 0.85
  lead_minutes: {min: 2, max: 30}          # payee saved / phone first seen before paying
  channel: IMPS

# docs/14 §4 "Mule networks": rings of 5–30 accounts across banks with 1–4 layers; with
# probability 0.5 a device is shared by ≥ 3 of a ring's accounts; false registry listings on
# 0.1% of genuine accounts.
mule_rings:
  size: {min: 5, max: 30}                    # docs/14; uniform (gap)
  layers: {min: 1, max: 4}                   # docs/14; uniform (gap)
  shared_device_probability: 0.5            # docs/14, per ring
  shared_device_min_accounts: 3             # docs/14
  false_listing_share: 0.001                # docs/14, of genuine non-merchant accounts
  # Gaps: one ring per 400 customers (at least 2); a mule banks at DLPH with probability 0.31,
  # else at an external bank (evenly). 0.31 is calibrated on `eval` (50 rings at one per 400
  # customers) so that home-bank mules' forwarding sessions come out at MULE_FORWARDING's 30
  # per 10,000 payments (docs/14 §4): 0.21 → 23.2, 0.29 → 27.4, 0.30 → 29.0, 0.31 → 30.9,
  # 0.34 → 36.1. A home-bank mule is a young, low-income customer (docs/13 §6 features: account
  # age, minimal KYC) with a small balance.
  customers_per_ring: 400
  min_rings: 2
  home_bank_share: 0.31
  age: {min: 19, max: 35}
  minimal_kyc_share: 0.5
  opened_days_before_history: {min: 5, max: 400}
  opening_balance_inr: {median: 2000, sigma: 0.8}

# The fraud victims' scenarios (docs/14 §4). The history runs them at the window's rates, per
# 10,000 payments: the genuine scenarios' 9,850 set the scale.
fraud:
  rate_per_10k: {ATO: 40, APP_DIGITAL_ARREST: 30, APP_INVESTMENT: 40}   # docs/14
  genuine_rate_per_10k: 9850               # docs/14: GENUINE_ROUTINE 9,700 + GENUINE_UNUSUAL 150
  payee_lead_minutes: {min: 2, max: 30}    # gap: a fraud payee is saved minutes before paying it
  ato:
    transfers: {min: 1, max: 3}            # docs/14
    drain_share: {min: 0.60, max: 0.95}    # docs/14, of the balance at the first transfer
    window_minutes: 30                     # docs/14
    # Gaps: half SIM swaps (the bank's CRM records the swap hours before), half phishing; the
    # attacker saves the mule payee right after logging in, and pays by IMPS or UPI.
    kind: {SIM_SWAP: 0.5, PHISHING: 0.5}
    sim_swap_lead_hours: {min: 1, max: 48}
    payee_lead_minutes: {min: 1, max: 5}
    channel: {IMPS: 0.6, UPI_PUSH: 0.4}
  digital_arrest:
    older_share: 0.6                       # docs/14: P(age ≥ 60) = 0.6
    older_age: 60
    transfers: {min: 1, max: 4}            # docs/14
    span_days: {min: 1, max: 3}            # docs/14
    # Gaps: each transfer sends a share of the balance at the time, to a layer-1 mule.
    balance_share: {min: 0.3, max: 0.8}
    channel: {IMPS: 0.6, NEFT: 0.3, UPI_PUSH: 0.1}
  investment:
    payments: {min: 3, max: 8}             # docs/14
    span_days: {min: 14, max: 42}          # docs/14: 2–6 weeks
    # Gaps: deposits escalate × 1.5 from a log-normal first deposit (× the income scale); then
    # 1–2 "withdrawal fees" of 10% of the deposits, in the last 20% of the span, to the same
    # platform account. A victim never sends more than 90% of the balance at the time.
    fee_payments: {min: 1, max: 2}
    fee_phase_share: 0.2
    first_amount_inr: {median: 5000, sigma: 0.5}
    escalation: 1.5
    fee_share: 0.10
    max_balance_share: 0.9
    channel: {UPI_PUSH: 0.7, IMPS: 0.3}
  # Gaps: how a reported fraud reaches the bank (docs/05 §1 channels).
  complaint_channel: {NCRP_1930: 0.7, BRANCH: 0.3}
  complaint_category:
    ATO: UNAUTHORISED_TRANSACTION
    APP_DIGITAL_ARREST: DIGITAL_ARREST_SCAM
    APP_INVESTMENT: INVESTMENT_SCAM

# Money moving down a ring (docs/14 §4). A mule forwards each credit after a log-normal dwell,
# as one onward transfer split into 1–3 payments to one account of the next layer. A
# final-layer account cashes the credit out (channel CASH_OUT) with probability 0.4, else the
# money stays. 40% of mule accounts are listed in the sim registry after their first fraud
# credit (docs/14 §7 delay).
forwarding:
  first_layer_dwell_minutes: {median: 12, sigma: 0.8}   # docs/14
  deeper_dwell_minutes: {median: 25, sigma: 0.8}        # docs/14
  splits: {min: 1, max: 3}                  # docs/14; uniform count, uniform shares (gap)
  cash_out_share: 0.4                       # docs/14
  registry_listing_share: 0.4               # docs/14
  split_gap_minutes: {min: 1, max: 5}       # gap: between the payments of one transfer
  channel: {IMPS: 0.5, UPI_PUSH: 0.5}       # gap
  cash_account_age_days: 3650               # gap: the banks' cash-out accounts are old
  # docs/14 §4: MULE_FORWARDING's rate. It is not an input: it follows from the ring
  # structure, the fraud rates, B1 and mule_rings.home_bank_share (calibrated to it). The stats
  # report checks it on the history.
  rate_per_10k: 30
  # Gap: a home-bank mule saves its next-layer payee 2–30 min before first paying it, like
  # any customer, so B1 sees it as new only while docs/13 §3 says so.
  payee_lead_minutes: {min: 2, max: 30}

# docs/14 §4: the hidden UPI_COLLECT_REFUND scenario runs in the live/eval window only, at 10 per
# 10,000 payments: the victim approves a collect request (₹2k–₹50k) believing it is a refund.
# Gaps: amounts log-uniform; the requester is a layer-1 mule; one payment per victim. The
# on-call-with-an-unknown-number share (60%) is its §5.1 telemetry target.
collect_refund:
  rate_per_10k: 10
  amount_inr: {min: 2000, max: 50000}
  max_balance_share: 0.9   # gap (#55): a victim cannot approve more than the balance
  channel: UPI_COLLECT_APPROVAL

# Gap: genuine customers report a SIM swap or a lost phone once per 500 days on average
# (docs/05 §1 CRM event types), so about 3% of genuine payments have one in the last 14 days.
crm:
  background_mean_days: 500
  types: {SIM_SWAP_REPORTED: 0.5, DEVICE_LOST_REPORTED: 0.5}

# The simulated external systems (docs/14 §9).
external_systems:
  fri:
    # docs/14: numbers used by fraud rings → VERY_HIGH 0.35 / HIGH-MEDIUM 0.35 / LOW 0.30;
    # genuine numbers → VERY_HIGH 0.005 / MEDIUM-HIGH 0.03. Gap: HIGH and MEDIUM split evenly.
    ring_numbers: {VERY_HIGH: 0.35, HIGH: 0.175, MEDIUM: 0.175, LOW: 0.30}
    genuine_numbers: {VERY_HIGH: 0.005, HIGH: 0.015, MEDIUM: 0.015, LOW: 0.965}
  cfcfrms:
    # docs/14: ack latency log-normal, median 20 min; 10% never acknowledged within 2 h.
    # Gap: σ 0.8 (the label-delay spread); a drawn latency past 2 h also counts as never.
    ack_minutes: {median: 20, sigma: 0.8}
    never_ack_share: 0.10
    ack_deadline_minutes: 120

# docs/14 §3: a genuine new-device event happens once per 400 days on average. Later payments
# use the newest device.
new_device_mean_days: 400

# Gap: every customer session starts with a login from its device, a few minutes earlier, in
# the customer's home city, from a stable /24 per device.
login_lead_s: {min: 30, max: 300}
cities:
  Delhi: {lat: 28.6139, lon: 77.2090}
  Lucknow: {lat: 26.8467, lon: 80.9462}
  Jaipur: {lat: 26.9124, lon: 75.7873}
  Bengaluru: {lat: 12.9716, lon: 77.5946}
  Mumbai: {lat: 19.0760, lon: 72.8777}
  Kolkata: {lat: 22.5726, lon: 88.3639}
  Hyderabad: {lat: 17.3850, lon: 78.4867}
  Chennai: {lat: 13.0827, lon: 80.2707}
