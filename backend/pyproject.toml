[project]
name = "delphi"
version = "0.1.0"
description = "DELPHI — Dynamic Evidence-Led Probing of fraud Hypotheses & Interventions"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "numpy>=2.1",
  "pandas>=2.2",
  "prometheus-client>=0.21",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.5",
  "sqlalchemy>=2.0.36",
  "structlog>=24.4",
  "uvicorn>=0.32",
]

[project.scripts]
delphi = "delphi.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.120",
  "coverage[toml]>=7.6",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "types-PyYAML>=6.0",
  "httpx>=0.28",
  "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delphi"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "benchmark: timing checks (warn-level in CI per docs/21 §1)",
  "integration: needs PostgreSQL (DELPHI_TEST_DATABASE_URL); docs/21 §1",
  "slow: minutes-long checks, e.g. the eval-profile stats (run with DELPHI_RUN_SLOW=1)",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = [
  "PLR0913",  # engine functions legitimately take many explicit parameters
  "PLR0911",
  "PLR0912",
  "RUF001",   # maths symbols (×, ≤, Σ, σ, −) are intentional: docstrings quote the spec's formulas
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0917", "PLC0415"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["delphi"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["delphi.engine.*", "delphi.kb.*"]
strict = true

[[tool.mypy.overrides]]
# scikit-learn and joblib ship no type information (docs/13 sensing models)
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["delphi"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- import-linter (docs/04 §4.1)
[tool.importlinter]
root_package = "delphi"

[[tool.importlinter.contracts]]
name = "engine is pure: only kb.model from delphi"
type = "forbidden"
source_modules = ["delphi.engine"]
forbidden_modules = [
  "delphi.kb.loader",
  "delphi.kb.validate",
  "delphi.probes",
  "delphi.platform",
  "delphi.api",
  "delphi.cli",
  "delphi.sim",
]

[[tool.importlinter.contracts]]
name = "kb.model depends on nothing in delphi"
type = "forbidden"
source_modules = ["delphi.kb.model"]
forbidden_modules = [
  "delphi.engine",
  "delphi.probes",
  "delphi.platform",
  "delphi.api",
  "delphi.cli",
  "delphi.kb.loader",
  "delphi.kb.validate",
]

[[tool.importlinter.contracts]]
name = "nothing imports the api layer except the CLI (docs/04 §4.1 rule 4)"
type = "forbidden"
source_modules = [
  "delphi.engine",
  "delphi.kb",
  "delphi.probes",
  "delphi.platform",
  "delphi.sensing",
  "delphi.sim",
]
forbidden_modules = ["delphi.api", "delphi.cli"]

[[tool.importlinter.contracts]]
name = "platform holds no business logic: it imports no feature module"
type = "forbidden"
source_modules = ["delphi.platform"]
forbidden_modules = ["delphi.engine", "delphi.kb", "delphi.probes", "delphi.sensing", "delphi.sim"]

[[tool.importlinter.contracts]]
name = "only sim and evaluation import ground truth (docs/04 §4.1 rule 5)"
type = "protected"
protected_modules = ["delphi.sim.truth"]
allowed_importers = ["delphi.sim", "delphi.evaluation"]
