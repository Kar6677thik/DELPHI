# Alembic configuration for running `uv run alembic ...` by hand from backend/.
# The application runs migrations with `delphi migrate`, which builds the same configuration in
# code. The database URL always comes from the environment (DELPHI_MIGRATE_DATABASE_URL, or
# DELPHI_DATABASE_URL), never from this file.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
