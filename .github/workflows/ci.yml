# CI (docs/23 §3): backend, frontend, contract, e2e and the security scanners (docs/19 §5,
# docs/21 §6, #127). The commit-policy check is in policy.yml. This workflow never writes to the
# repository.
name: ci

# Runs once per PR update (not also on the branch push, which doubled every run), and from
# deploy.yml. Open a draft PR to get CI on a branch.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # postgres:16.15; the same major as production (docs/24 §3)
        image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests create and drop their own databases on this server (docs/21 §1).
      DELPHI_TEST_DATABASE_URL: postgresql://postgres:ci-only-not-a-secret@localhost:5432/postgres
      DELPHI_REQUIRE_INTEGRATION: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
          working-directory: backend
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Types
        run: uv run mypy
      - name: Module contracts
        run: uv run lint-imports
      - name: Validate KB
        run: uv run delphi kb validate ../kb
      - name: Tests (unit, property, golden, integration on PostgreSQL 16)
        run: uv run coverage run -m pytest
      - name: Coverage gates (engine ≥ 95%, overall ≥ 80%)
        run: |
          uv run coverage report --include="src/delphi/engine/*" --fail-under=95
          uv run coverage report --fail-under=80

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json # pnpm version from "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Format
        run: pnpm format:check
      - name: Tests (Vitest with coverage thresholds from vite.config.ts)
        run: pnpm test
      - name: Audit (production dependencies)
        run: pnpm audit --prod
      - name: Build
        run: pnpm build

  # The API contract (docs/16): the generated TypeScript types must match backend/openapi.json.
  # backend/openapi.json itself is checked against the code by a backend test.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generated API types are up to date
        run: pnpm check:api

  # End to end (docs/21 §4): the production image in the compose stack (compose.yaml), and the
  # Playwright journeys against it: the M0 login smoke test, and the story journeys as
  # their milestones land.
  e2e:
    # The browser runs in Microsoft's Playwright image (Chromium and its system packages
    # included, the same version as @playwright/test), so the job never needs apt: Ubuntu's
    # mirrors timing out was the e2e job's only flake.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack (postgres, migrate, api, worker)
        run: docker compose up --build --detach --wait --wait-timeout 300 api worker
      # The story journeys (E2E-S2, #101) need the demo dataset with its personas, and the
      # sensing models trained on it: the seed job queues the training. About two minutes.
      - name: Seed the demo dataset and train the models
        run: |
          docker compose exec -T api delphi seed --profile demo
          jobs() {
            docker compose exec -T postgres psql -U postgres -d delphi -tA -c \
              "select type || ' ' || status from delphi.jobs
               where type in ('GENERATE_DATASET', 'TRAIN_SENSING') order by created_at"
          }
          for _ in $(seq 1 90); do
            state="$(jobs)"
            if grep -q FAILED <<<"$state"; then echo "$state"; exit 1; fi
            if grep -q "TRAIN_SENSING SUCCEEDED" <<<"$state"; then echo "$state"; exit 0; fi
            sleep 10
          done
          echo "the dataset and models were not ready in 15 minutes:"; jobs; exit 1
      - name: Journeys (Playwright 1.55.0, Chromium)
        run: >-
          docker run --rm --network host --ipc host
          --volume "$PWD/frontend:/work" --workdir /work
          --env CI=1 --env E2E_BASE_URL=http://localhost:8000
          --env COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          mcr.microsoft.com/playwright:v1.55.0-noble@sha256:b27e719ecbfef153e13fd24e8341736733bf2658b229677eb21ff57ff5d7fb29
          sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm e2e"
      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # Secrets in the history, vulnerable Python dependencies and risky Python code (docs/19 §5).
  # pnpm audit runs in the frontend job. Tools run from images and packages pinned exactly.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads every commit
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
          working-directory: backend
      - name: Secrets (gitleaks 8.28.0, the whole history)
        run: >-
          docker run --rm --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --redact --no-banner --exit-code 1
      - name: Python dependencies (pip-audit 2.9.0, runtime only)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.9.0 --requirement "$RUNNER_TEMP/requirements.txt" --strict --progress-spinner off
      - name: Python code (bandit 1.8.6, settings in pyproject.toml)
        working-directory: backend
        run: uvx bandit[toml]==1.8.6 --configfile pyproject.toml --recursive src --quiet

  # The production image, built but never pushed, scanned for HIGH and CRITICAL vulnerabilities
  # that have a fix (docs/21 §6). A waiver goes in security/waivers.yaml, then .trivyignore.
  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image (not pushed)
        run: docker build --tag delphi:scan .
      - name: Scan (Trivy 0.65.0)
        run: >-
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock
          --volume "$PWD:/src" --workdir /src
          aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile .trivyignore --no-progress delphi:scan

  # New dependencies a PR adds, checked against the GitHub advisory database.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
