# CI (docs/23 §3): backend, frontend and contract jobs. The secrets, e2e and image-scan jobs
# arrive with the rest of M0 (#10). The commit-policy check is in policy.yml. This workflow never writes to the repository.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # postgres:16.15; the same major as production (docs/24 §3)
        image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests create and drop their own databases on this server (docs/21 §1).
      DELPHI_TEST_DATABASE_URL: postgresql://postgres:ci-only-not-a-secret@localhost:5432/postgres
      DELPHI_REQUIRE_INTEGRATION: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          working-directory: backend
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Types
        run: uv run mypy
      - name: Module contracts
        run: uv run lint-imports
      - name: Validate KB
        run: uv run delphi kb validate ../kb
      - name: Tests (unit, property, golden, integration on PostgreSQL 16)
        run: uv run coverage run -m pytest
      - name: Coverage gates (engine ≥ 95%, overall ≥ 80%)
        run: |
          uv run coverage report --include="src/delphi/engine/*" --fail-under=95
          uv run coverage report --fail-under=80

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json # pnpm version from "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Format
        run: pnpm format:check
      - name: Tests (Vitest with coverage thresholds from vite.config.ts)
        run: pnpm test
      - name: Audit (production dependencies)
        run: pnpm audit --prod
      - name: Build
        run: pnpm build

  # The API contract (docs/16): the generated TypeScript types must match backend/openapi.json.
  # backend/openapi.json itself is checked against the code by a backend test.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generated API types are up to date
        run: pnpm check:api
