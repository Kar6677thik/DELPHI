# Local development stack (docs/23 §1). For now: PostgreSQL only, matching production's major
# version. The api/worker services and the e2e profile are added with the Dockerfile (#9).
#
#   docker compose up -d postgres
#   export DELPHI_DATABASE_URL=postgresql://postgres:dev-only@localhost:5432/delphi
#   export DELPHI_TEST_DATABASE_URL=postgresql://postgres:dev-only@localhost:5432/postgres
#
# The password is a local development default, not a secret. Never reuse it anywhere else.
name: delphi

services:
  postgres:
    image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    environment:
      POSTGRES_PASSWORD: dev-only
      POSTGRES_DB: delphi
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
