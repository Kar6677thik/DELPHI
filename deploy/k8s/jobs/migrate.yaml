# The migrate Job (docs/23 §4). The deploy workflow replaces __NAME__ (delphi-migrate-<sha7>)
# and __IMAGE__ (ghcr.io/kar6677thik/delphi@sha256:…) and creates it before rolling out.
apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
  namespace: delphi
  labels: { app.kubernetes.io/name: delphi, app.kubernetes.io/component: migrate }
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: delphi
        app.kubernetes.io/component: migrate
        delphi.io/db-client: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: __IMAGE__
          args: ["migrate"]
          envFrom:
            - configMapRef: { name: delphi-config }
            - secretRef: { name: delphi-migrate }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
