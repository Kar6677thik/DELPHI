# The api (docs/04 §3, docs/23 §4): HTTP API, SSE and the SPA on :8000. The deploy workflow
# changes only its image (by digest). The Service's fixed ClusterIP, which the host tunnel
# targets, is set in the operator's private overlay.
apiVersion: v1
kind: Service
metadata:
  name: delphi-api
  namespace: delphi
  labels: { app.kubernetes.io/name: delphi, app.kubernetes.io/component: api }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: delphi, app.kubernetes.io/component: api }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delphi-api
  namespace: delphi
  labels: { app.kubernetes.io/name: delphi, app.kubernetes.io/component: api }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: delphi, app.kubernetes.io/component: api }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: delphi
        app.kubernetes.io/component: api
        delphi.io/db-client: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/kar6677thik/delphi # the overlay pins the digest; deploys change it
          args: ["api"]
          envFrom:
            - configMapRef: { name: delphi-config }
            - secretRef: { name: delphi-app } # never the sim URL (docs/17 §2)
          ports:
            - { name: http, containerPort: 8000 }
            - { name: metrics, containerPort: 9000 }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          startupProbe: # tolerates a cold start after the node reboots
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /api/v1/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 128Mi } }
