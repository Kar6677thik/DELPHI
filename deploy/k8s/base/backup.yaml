# Nightly logical backup (docs/23 §8): pg_dump -Fc at 21:30 IST, the 7 most recent kept.
# The PVC is on the same disk as the database: this protects against mistakes, not against
# losing the disk. An off-host copy is the owner's decision.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: delphi-backups
  namespace: delphi
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: delphi-pg-backup
  namespace: delphi
  labels:
    app.kubernetes.io/name: delphi
    app.kubernetes.io/component: backup
    orbit.backup/scope: local # a copy on this host; Orbit tells it from off-host ones (#181)
spec:
  # Explicit zone: without it k3s reads the schedule in the node's zone (IST), which is how
  # "30 21" ran at 16:00 UTC. The off-site copy (16:30 UTC) is timed after this run.
  timeZone: Etc/UTC
  schedule: "0 16 * * *" # = 21:30 IST
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: delphi
            app.kubernetes.io/component: backup
            delphi.io/db-client: "true"
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
              envFrom:
                - secretRef: { name: delphi-postgres }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  rm -f /backups/*.part # a failed run's partial dump (concurrencyPolicy: Forbid, #183)
                  out="/backups/delphi-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  # k3s (kube-router) programs a new pod's NetworkPolicy rules a few seconds after
                  # it starts; until then its connections are refused. Wait up to ~60 s (#181).
                  db="-h delphi-postgres -p 5432 -U ${POSTGRES_USER:-postgres} -d delphi"
                  for i in $(seq 1 30); do pg_isready $db -t 2 && break; sleep 2; done
                  pg_isready $db -t 2 || { echo "postgres unreachable after 60s"; exit 1; }
                  pg_dump -h delphi-postgres -U "${POSTGRES_USER:-postgres}" -d delphi -Fc -f "$out.part"
                  mv "$out.part" "$out"
                  ls -1t /backups/delphi-*.dump | tail -n +8 | xargs -r rm --
                  echo "wrote $out"; ls -lh /backups
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: backups, mountPath: /backups }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: delphi-backups }
            - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
